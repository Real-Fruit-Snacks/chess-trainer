version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler) cannot be installed beside typescript-eslint, whose
      # peer range stops at 6.x; drop this once typescript-eslint accepts 7.
      - dependency-name: typescript
        versions: ['>=7.0.0']
    labels: [dependencies]

  # Workflows pin every action to a commit SHA with its version in a comment;
  # Dependabot moves both. The composite setup action is watched too.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]
