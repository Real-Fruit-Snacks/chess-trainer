name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly on main: the same jobs, and a test that only passes on a retry fails the run.
  schedule:
    - cron: '17 3 * * *'

# The nightly run gets a group of its own, so it can never cancel the run that gates a deploy.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request is checked out as its merge commit, whose first parent is the base.
          fetch-depth: 2

      # Documentation-only pull requests skip the build, the browsers and the audits.
      - name: Documentation only?
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/ci-changes.mjs HEAD^1 >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The model, so the unit test that runs it on real positions is not skipped.
      - uses: ./.github/actions/setup
        with:
          maia: 'true'

      - name: Lint
        run: npm run lint

      - name: Dead code and dependencies
        run: npm run lint:dead

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (fails below the coverage floor)
        run: npm run test:coverage

      - name: Validate puzzle data
        run: npm run puzzles:verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup
        with:
          engine: 'true'
          maia: 'true'

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: Check the bundle budget
        run: npm run bundle:check

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: mobile-chromium
            browser: chromium
          - project: desktop-firefox
            browser: firefox
          - project: desktop-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup
        with:
          browser: ${{ matrix.browser }}

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Run Playwright
        run: npx playwright test --project="$PROJECT"
        env:
          CI: 'true'
          PROJECT: ${{ matrix.project }}
          # Pull requests and pushes keep two retries; the nightly run fails on any flaky test.
          PLAYWRIGHT_FAIL_ON_FLAKY: ${{ github.event_name == 'schedule' && '1' || '0' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # The offline copy's launcher (launcher/, Go), on each system it ships for: what it does with
  # ports, paths and consoles differs between them.
  launcher:
    name: Launcher (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: launcher/go.mod
          # The launcher has no dependencies to cache.
          cache: false

      - name: Format, vet and test
        working-directory: launcher
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted (run gofmt -w launcher): $unformatted"
            exit 1
          fi
          go vet ./...
          go test ./...

  # The offline copy a release attaches (scripts/package-offline.mjs): packaged from this build,
  # unzipped and tried in a browser with its own launcher.
  offline:
    name: Offline copy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, launcher]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup
        with:
          browser: chromium

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: launcher/go.mod
          cache: false

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Package the offline copy
        run: npm run release:offline

      - name: Try the download
        run: |
          mkdir -p release/check
          unzip -q release/chess-trainer-*-offline.zip -d release/check
          OFFLINE_BUNDLE="$(ls -d release/check/chess-trainer-*)" npm run e2e:offline
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-offline
          path: playwright-report/
          retention-days: 7

  production-path:
    name: Production base path (desktop Chromium)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A project site's path on GitHub Pages; playwright.config.ts follows it and serves the
      # build with scripts/serve-dist.mjs, which answers deep links with 404.html as Pages does.
      VITE_BASE_PATH: /chess-trainer/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup
        with:
          engine: 'true'
          maia: 'true'
          browser: chromium

      - name: Build for /chess-trainer/
        run: npm run build

      - name: Smoke test, deep link and 404 fallback
        run: npx playwright test --project=desktop-chromium e2e/release-0-12-meta.spec.ts
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-production-path
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual snapshots
    # The pixel baselines are rendered with Ubuntu 24.04's fonts; ubuntu-latest moves to
    # Ubuntu 26 from 19 October 2026. Move this with the baselines (`--update-snapshots`).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup
        with:
          browser: chromium

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Compare snapshots
        run: npm run e2e:visual
        env:
          CI: 'true'

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Serve the build
        run: |
          npm run preview -- --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

      - name: Audit with Lighthouse
        run: npm run lighthouse -- --json lighthouse.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse
          path: lighthouse.json
          retention-days: 7
