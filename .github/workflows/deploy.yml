name: Deploy to GitHub Pages

# Deploys main once CI has passed on it — exactly the commit CI tested — or on demand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; don't cancel in-progress runs so a
# production deploy is never left half-finished.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    # A CI run that passed on a push to this repository's main — not the nightly run, and
    # never a pull request whose branch happens to be called main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # Dependencies without install scripts, then the engine and the human-like opponent's
      # files, downloaded and checksum-verified.
      - uses: ./.github/actions/setup
        with:
          engine: 'true'
          maia: 'true'

      - name: Build
        # configure-pages reports the site's base path ("/" for user/org sites,
        # "/<repo>" for project sites) so the same workflow works for both.
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # Never deployed: kept here to read the stacks of crash reports from this build
      # (the report names the commit).
      - name: Keep the source maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sourcemaps-${{ github.event.workflow_run.head_sha || github.sha }}
          path: sourcemaps/
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
