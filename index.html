<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SITE_NAME% — %SITE_TAGLINE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <!-- The browser UI follows the page background; the inline script below picks
         the saved scheme before the first paint, the app keeps it current after. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="%SITE_LIGHT_BACKGROUND%"
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="%SITE_BACKGROUND%" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applies the saved colour scheme and piece set before anything paints, so
      // a visitor who chose dark (or light, or black) never sees a flash of the
      // other scheme. Mirrors applyColorScheme() in src/app/theme.ts.
      (function () {
        try {
          // The active profile's settings (a profile without its own has the main one's).
          var key = 'chess-trainer:settings';
          var profiles = JSON.parse(localStorage.getItem('chess-trainer:profiles') || 'null');
          var active = profiles && profiles.activeId;
          if (typeof active === 'string' && active !== 'default') {
            if (localStorage.getItem(key + ':' + active) !== null) key = key + ':' + active;
          }
          var raw = localStorage.getItem(key);
          var state = raw ? JSON.parse(raw).state || {} : {};
          var scheme = state.colorScheme;
          var root = document.documentElement;
          if (scheme === 'light' || scheme === 'dark' || scheme === 'black') {
            root.setAttribute('data-theme', scheme);
            var colour =
              scheme === 'black'
                ? '%SITE_BLACK_BACKGROUND%'
                : scheme === 'dark'
                  ? '%SITE_BACKGROUND%'
                  : '%SITE_LIGHT_BACKGROUND%';
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i++) {
              if (i === 0) {
                metas[i].removeAttribute('media');
                metas[i].setAttribute('content', colour);
              } else {
                metas[i].parentNode.removeChild(metas[i]);
              }
            }
          }
          if (typeof state.pieceSet === 'string') root.setAttribute('data-pieces', state.pieceSet);
        } catch (e) {
          // No storage, or a damaged blob: the system scheme applies until the app loads.
        }
      })();
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%SITE_SHORT_NAME%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_NAME% — %SITE_TAGLINE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%SITE_NAME% — %SITE_TAGLINE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%icons/icon-512.png" />
  </head>
  <body>
    <noscript>
      <div
        style="padding: 2rem; font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto"
      >
        <h1>JavaScript is required</h1>
        <p>
          %SITE_NAME% runs entirely in your browser — the lessons, puzzles and engine all need
          JavaScript enabled.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
